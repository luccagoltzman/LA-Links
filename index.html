<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#031127" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LA Veículos" />
    <meta name="description" content="LA Veículos — catálogo digital, loja e redes sociais." />

    <title>LA Veículos</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="LA Veículos" />
    <meta property="og:description" content="Catálogo digital, loja e redes sociais." />
    <meta property="og:image" content="assets/logo_LA.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="assets/logo_LA.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/logo_LA.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <a class="skip" href="#catalogo">Ir para o catálogo</a>

    <div class="ambient" aria-hidden="true">
      <div class="ambient__spot" data-spot></div>
      <div class="ambient__orb ambient__orb--a"></div>
      <div class="ambient__orb ambient__orb--b"></div>
      <div class="ambient__grid"></div>
      <div class="ambient__noise"></div>
    </div>

    <main class="stage">
      <article class="card">
        <header class="brand">
          <div class="plate">
            <div class="plate__disk">
              <img class="plate__logo" src="assets/logo_LA.png" alt="LA Veículos" width="88" height="88" />
            </div>
          </div>

          <p class="kicker">Perfil oficial</p>
          <h1 class="headline" data-brand>LA Veículos</h1>
          <p class="lede" data-tagline>Soluções em veículos com qualidade e transparência.</p>
        </header>

        <nav class="stack" aria-label="Atalhos">
          <a class="cta" id="catalogo" data-catalog rel="noopener noreferrer">
            <span class="cta__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" />
                <path d="M3 9h18" stroke="currentColor" stroke-width="1.8" />
                <path d="M8 13h4M8 16.5h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </span>
            <span class="cta__copy">
              <strong data-catalog-label>Catálogo digital</strong>
              <small data-catalog-hint>Estoque completo, com fotos e preços</small>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>

          <a class="row" data-whatsapp target="_blank" rel="noopener noreferrer">
            <span class="row__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12.1 3.6a8.4 8.4 0 0 0-7.2 12.7L4 20.4l4.3-.8a8.4 8.4 0 1 0 3.8-16Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                <path d="M9.1 8.5c.2-.5.4-.5.7-.5h.5c.2 0 .4 0 .5.4l.7 1.7c.1.3 0 .5-.2.7l-.4.5a7.6 7.6 0 0 0 2.6 2.6l.5-.4c.2-.2.5-.2.7-.1l1.7.7c.3.1.4.3.4.5v.5c0 .3 0 .5-.5.7A5.2 5.2 0 0 1 9.1 8.5Z" fill="currentColor" />
              </svg>
            </span>
            <span class="row__copy">
              <strong>WhatsApp</strong>
              <small data-whatsapp-label>Fale com a loja agora</small>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>

          <a class="row" data-maps target="_blank" rel="noopener noreferrer">
            <span class="row__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 21s7-6.2 7-11.2A7 7 0 1 0 5 9.8C5 14.8 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" />
                <circle cx="12" cy="9.8" r="2.2" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </span>
            <span class="row__copy">
              <strong>Como chegar</strong>
              <small data-place-line>São Luís — MA</small>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>

          <button class="row row--button" type="button" data-copy-address>
            <span class="row__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8" />
                <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </span>
            <span class="row__copy">
              <strong>Copiar endereço</strong>
              <small>Salvar a localização da loja</small>
            </span>
          </button>
        </nav>

        <p class="place__hours" data-place-hours hidden></p>

        <section class="social" data-social-wrap hidden>
          <h2 class="social__title">Outras redes</h2>
          <div class="social__list" data-socials></div>
        </section>

        <div class="dock">
          <div class="toolbar">
            <a class="ghost" data-phone>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7.2 3.8h2.6l1.2 3-1.8 1.1a12.5 12.5 0 0 0 6.9 6.9l1.1-1.8 3 1.2v2.6c0 .7-.6 1.4-1.3 1.5-8.2 1.1-15.1-5.8-14-14 .1-.7.8-1.3 1.5-1.3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              </svg>
              Ligar
            </a>
            <button class="ghost" type="button" data-share>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="18" cy="5" r="2.4" stroke="currentColor" stroke-width="1.8" />
                <circle cx="6" cy="12" r="2.4" stroke="currentColor" stroke-width="1.8" />
                <circle cx="18" cy="19" r="2.4" stroke="currentColor" stroke-width="1.8" />
                <path d="M8.2 13.1 15.7 17.4M15.8 6.6 8.3 10.8" stroke="currentColor" stroke-width="1.8" />
              </svg>
              Compartilhar
            </button>
          </div>

          <p class="foot">© <span data-year>2026</span> <span data-brand-foot>LA Veículos</span></p>
        </div>
      </article>
    </main>

    <div class="toast" data-toast hidden role="status"></div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
